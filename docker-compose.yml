services:
  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ContactDb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ContactDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./KisiRehberiApi
      dockerfile: Dockerfile
    ports:
      - "5163:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=ContactDb;Username=postgres;Password=postgres"
      Jwt__Key: "DockerIcinEnAz32KarakterlikGucluBirJwtKey!"
      Jwt__Issuer: "KisiRehberiApi"
      Jwt__Audience: "KisiRehberiAngular"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ./kisi-rehberi-ui
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata: